name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Bootstrap after reset, or release after login proof
        required: true
        type: choice
        options: [release, bootstrap]
        default: release
      approved_sha:
        description: Full main SHA approved after reset and release review
        required: true
        type: string
      release_plan_hash:
        description: SHA-256 of the reviewed deploy/platform-release.json
        required: true
        type: string

permissions:
  contents: read
  # The owner review gate reads the pull requests and reviews of each protected commit (#424).
  pull-requests: read

jobs:
  # The owner review gate (#424) without production credentials, before the
  # validation: a commit missing an owner's approval fails here in seconds and
  # spends no validation. The publisher repeats the gate in its preflight
  # against the revision then published; this job only anticipates it. On a
  # push it then looks for the PR validation of the same tree against the same
  # previous main (scripts/lib/validation-reuse.mjs); when there is one, the
  # validation does not run again.
  preflight:
    name: Owner review and validation reuse
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.approved_sha == github.sha)
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    # Reads the PR's CI runs and their `ci-*` artifact, besides the reviews.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      tested_sha: ${{ steps.reuse.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History for the range since the published revision.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "24.22.1"
          run-install: false
          cache: false
      - name: Require the owner's approval of every protected commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/owner-review-check.mjs
      # Never fails the run: without a reused validation the output stays empty
      # and `validate` runs as before.
      - name: Reuse the PR validation of the same tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validation-reuse.mjs
  validate:
    needs: preflight
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.approved_sha == github.sha) && needs.preflight.outputs.tested_sha == ''
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish production
    needs: [preflight, validate]
    # `validate` is skipped when the PR validation was reused, so the condition
    # names every outcome it accepts instead of the implicit success().
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      (needs.preflight.outputs.tested_sha || needs.validate.outputs.tested_sha) == github.sha
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tested_sha || needs.validate.outputs.tested_sha }}
          persist-credentials: false
          # History for the published-revision comparison (scripts/lib/platform-unchanged.mjs).
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "24.22.1"
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - name: Identify the versioned plan for an automatic release
        if: github.event_name == 'push'
        id: plan
        run: |
          node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; import { createHash } from "node:crypto"; const hash = createHash("sha256").update(readFileSync("deploy/platform-release.json")).digest("hex"); appendFileSync(process.env.GITHUB_OUTPUT, "sha256=" + hash + "\n");'
      - name: Publish the approved replacement platform
        env:
          CI_TESTED_SHA: ${{ needs.preflight.outputs.tested_sha || needs.validate.outputs.tested_sha }}
          RELEASE_APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          RELEASE_PLAN_HASH: ${{ github.event_name == 'push' && steps.plan.outputs.sha256 || inputs.release_plan_hash }}
          RELEASE_OPERATION: ${{ github.event_name == 'push' && 'release' || inputs.operation }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/deploy-platform.mjs
      - name: Record publication or partial failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/platform-release/receipt.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
