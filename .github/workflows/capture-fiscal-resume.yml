name: Fiscal capture, resume after the general stop

# Lifts the persisted general stop recorded by capture-fiscal-halt.yml (#424). It opens nothing
# by itself: each company still needs its release, its own A1 and both variables of the
# deployment. It reschedules nothing either: during the stop every query was postponed, not
# paused, so each stream queries at its next check, within an hour, with nothing for the
# customer to do. Only
# a person in authorizedActors of deploy/issuance-gate.json may trigger it, without approval like
# capture-release-unblock.yml (ADR 0007, amendment of 22/10/2026: the GitHub plan has no required
# reviewers); the command is fixed: `kind: "resume"` in scripts/lib/capture-release.mjs. It is
# refused when the capture is not stopped and when /health does not confirm the site.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason, 10 to 500 characters. Public: no customer name, CNPJ or personal data."
        required: true
        type: string

permissions:
  contents: read

# Its own group: a resume never queues the general stop.
concurrency:
  group: capture-fiscal-resume
  cancel-in-progress: false

jobs:
  resume:
    name: Lift the general stop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: capture-fiscal-emergency
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node of the runner image runs the executor, which only uses Node built-in modules
      # (fetch and AbortSignal.timeout need 20 or newer); the action downloads nothing it depends on.
      # Seals the full receipt for the custodians (scripts/lib/sealed-receipt.mjs). It never
      # blocks the action: without age, the public receipt records sealed.state "unavailable".
      - name: Install pinned age for the sealed receipt
        continue-on-error: true
        timeout-minutes: 2
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "AGE_BIN=$RUNNER_TEMP/age/age" >> "$GITHUB_ENV"
      - name: Check the Node.js of the runner image
        run: node -e 'const major = Number(process.versions.node.split(".")[0]); if (!(major >= 20)) { console.error("Node " + process.versions.node + " is older than 20"); process.exit(1); }'
      - name: Check the run and the authorized person, then resume
        env:
          GATE_REASON: ${{ inputs.reason }}
          CONVEX_DEPLOY_KEY: ${{ secrets.FNFE_SITE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/capture-release.mjs resume
      - name: Record the change or the refusal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-fiscal-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-results/capture-release/receipt.json
            .ci-results/capture-release/receipt.full.json.age
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
