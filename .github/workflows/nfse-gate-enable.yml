name: NFS-e production gate, enable

# Turns on the fiscal production gate of one company (#198, ADR 0004 §8). One person dispatches;
# another approves the run in the protected environment `nfse-production-gate`, configured with
# required reviewers and Prevent self-review (a human step, docs/operacao/emissao-nfse.md). The
# runner reads who triggered and who approved from the GitHub API, never from an input, and calls
# `issuance:setProductionGate` with `kind: "enable"` fixed in scripts/lib/issuance-gate.mjs.
# While deploy/issuance-production.json names no deployment, the plan job fails, the approval is
# never requested and nothing reaches Convex.
on:
  workflow_dispatch:
    inputs:
      organization_id:
        description: Convex id of the organization (organizations)
        required: true
        type: string
      company_id:
        description: Convex id of the company (companies), already in FNFE_NFSE_PRODUCTION_COMPANIES
        required: true
        type: string
      reason:
        description: "Reason, 10 to 500 characters. Public: no customer name, CNPJ or personal data."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nfse-production-gate
  cancel-in-progress: false

jobs:
  plan:
    name: Versioned plan names the fiscal production deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner only needs Node: it uses Node built-in modules and installs no dependency.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: node scripts/deploy/issuance-gate.mjs plan

  enable:
    name: Enable the gate after another person's approval
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nfse-production-gate
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner only needs Node: it uses Node built-in modules and installs no dependency.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      # Seals the full receipt for the custodians (scripts/lib/sealed-receipt.mjs). It never
      # blocks the action: without age, the public receipt records sealed.state "unavailable".
      - name: Install pinned age for the sealed receipt
        continue-on-error: true
        timeout-minutes: 2
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "AGE_BIN=$RUNNER_TEMP/age/age" >> "$GITHUB_ENV"
      - name: Check the run and its approval, then enable
        env:
          GATE_ORGANIZATION_ID: ${{ inputs.organization_id }}
          GATE_COMPANY_ID: ${{ inputs.company_id }}
          GATE_REASON: ${{ inputs.reason }}
          CONVEX_DEPLOY_KEY: ${{ secrets.FNFE_ISSUANCE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy/issuance-gate.mjs enable
      - name: Record the change or the refusal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nfse-gate-enable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-results/issuance-gate/receipt.json
            .ci-results/issuance-gate/receipt.full.json.age
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
