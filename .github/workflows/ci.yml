name: CI

# A pull request runs only what its change can affect: a documentation-only
# change runs formatting and the credential scan, and any other change runs the
# `validate` graph, where each task whose inputs match a passing result replays
# it from the Vite Task cache. A push on main replays the merged pull request's
# results and saves the cache later pull requests start from. It does not gate
# the production deploy, which deploy.yml runs on its own
# (docs/desenvolvimento/ci.md).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    outputs:
      tested_sha:
        description: Exact checkout validated by every check
        value: ${{ jobs.validate.outputs.tested_sha }}
      publication_sha:
        description: Manual validation publication from main only; empty otherwise
        value: ${{ jobs.validate.outputs.publication_sha }}

permissions:
  contents: read

# A new push to a pull request cancels its superseded validation. Every other
# run (push on main, manual and workflow_call publications) gets a group of its
# own, so this never cancels or queues them: a push run that finishes saves the
# cache the next pull requests restore.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every check runs in one job: install once, then `vp run validate` runs the
  # task graph in parallel. The standard GitHub-hosted runner is free for a
  # public repository and has 4 vCPUs, where the tests no longer compete with
  # builds and type checks as they did on 2
  # (docs/desenvolvimento/ci.md, Runners e custo). No secrets: this also
  # validates publications.
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # actions and pull-requests: read, only so a push on main can find the
    # merged pull request's run and download its task cache. The repository is
    # public, so both read what anyone can see; the token goes only to those
    # push-only steps. The callers (deploy-validation.yml and
    # deploy-issuance-production.yml) grant the same, since a called workflow
    # cannot ask for more than its caller.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested_sha: ${{ steps.approve.outputs.tested_sha }}
      publication_sha: ${{ steps.gate.outputs.publication_sha }}
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "24.22.1"
          run-install: false
          # No node_modules cache: every run installs from the lockfile. Only
          # the Vite Task cache is restored, after the install.
          cache: false
      # mode: docs (a pull request that changes only documentation no task but
      # formatting and the credential scan reads) or graph. cache: whether the
      # graph uses the Vite Task cache (this workflow's own pull_request and
      # push runs) or runs every task (manual runs and workflow_call
      # publications). Fails open: a diff it cannot resolve runs the graph.
      - name: Classify the change
        id: changes
        run: node scripts/ci/ci-changes.mjs
      - name: Record exact checkout and PR head
        run: node scripts/ci/ci.mjs identity
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      # What in the graph reads documentation-only files, run directly:
      # formatting, the credential scan and the tests that read every tracked
      # Markdown (documentationTests in scripts/lib/ci-changes.mjs). No
      # tested_sha comes out of this mode: approve and gate are skipped.
      - name: Check documentation
        if: steps.changes.outputs.mode == 'docs'
        run: |
          vp fmt --check
          node scripts/public-copy/check-secrets.mjs
          vp test run scripts/public-copy/public-identifiers.test.ts scripts/public-copy/public-tree.test.ts
      # Restores the newest cache this ref may read: its own (a previous push to
      # the pull request) or main's. The key follows the Vite+ guide: OS,
      # architecture and run, never source or lockfile hashes; Vite Task
      # fingerprints those itself and replays a task only when they match.
      - name: Restore the task cache
        id: task_cache
        if: steps.changes.outputs.cache == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      # main cannot read a pull request's Actions cache (GitHub scopes it by
      # ref), so a push replays the merged pull request's cache from the
      # artifact its last successful run on the final head uploaded, from this
      # repository only, never a fork's (scripts/lib/ci-task-cache.mjs). None of
      # these steps fails the job: without that cache the tasks simply run.
      - name: Find the merged pull request's task cache
        id: pr_cache
        if: steps.changes.outputs.cache == 'true' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-task-cache.mjs
      - name: Download the merged pull request's task cache
        id: pr_cache_download
        if: steps.pr_cache.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vite-task-cache
          run-id: ${{ steps.pr_cache.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-task-cache
      - name: Use the merged pull request's task cache
        if: steps.pr_cache_download.outcome == 'success'
        continue-on-error: true
        run: |
          # Whole directory, so the database never mixes with main's write-ahead
          # log. Only something shaped like a task cache, and of a sane size.
          size=$(du -sm "$RUNNER_TEMP/pr-task-cache" | cut -f1)
          if [ "$size" -gt 2048 ]; then
            echo "The artifact has ${size} MB; keeping main's task cache"
          elif [ -n "$(find "$RUNNER_TEMP/pr-task-cache" -name cache.db -print -quit)" ]; then
            rm -rf node_modules/.vite/task-cache
            mkdir -p node_modules/.vite
            mv "$RUNNER_TEMP/pr-task-cache" node_modules/.vite/task-cache
            echo "Using the merged pull request's task cache"
          else
            echo "The artifact has no task cache; keeping main's"
          fi
      # The cipher tests of the cold archive, the incremental backup and the
      # sealed receipt run the real age, from the release and checksum the
      # backup verifies. On PATH, not AGE_BIN: a test task receives only the
      # variables Vite Task passes through. With CI=true a missing age fails
      # those tests instead of skipping them (tests/helpers/age.ts).
      - name: Install pinned age
        if: steps.changes.outputs.mode == 'graph'
        timeout-minutes: 2
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          curl -fsSL --retry 3 --retry-all-errors --max-time 60 -o "$RUNNER_TEMP/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      # The graph in vite.config.ts: fiscal packages, REST contract, SDK and XML
      # consumer proofs, format/lint/types, tsc, one test task per area,
      # Wrangler tooling, validation console and auth proxy proof, in dependency
      # order and side by side. With the cache, a task whose inputs match a
      # passing run replays it, and a failure is never cached. Without it
      # (--no-cache) every task runs. Output is grouped per task, with a summary
      # at the end saying which tasks ran and which replayed.
      - name: Build, check and test
        id: graph
        if: steps.changes.outputs.mode == 'graph'
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The flag is the truthy branch: Actions treats '' as false, so
          # `cache == 'true' && '' || '--no-cache'` would always disable it.
          TASK_CACHE: ${{ steps.changes.outputs.cache != 'true' && '--no-cache' || '' }}
        run: |
          if [ -z "$CONTRACT_BASE" ] || [ "$CONTRACT_BASE" = "0000000000000000000000000000000000000000" ]; then
            CONTRACT_BASE=$(git rev-parse HEAD^)
          fi
          export CONTRACT_BASE
          vp run $TASK_CACHE --verbose --log grouped validate
      # Inspects the built dist of the fiscal packages, so it follows the graph.
      - name: Check independent package boundaries
        if: steps.changes.outputs.mode == 'graph'
        run: vp run ci:boundaries
      - name: Locate the current SDK validation package
        id: sdk_artifact
        if: steps.changes.outputs.mode == 'graph'
        run: |
          node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { sdkTarballPath } from "./scripts/lib/sdk-artifact.mjs"; appendFileSync(process.env.GITHUB_OUTPUT, "path=" + sdkTarballPath() + "\n");'
      - name: Upload SDK validation package
        if: steps.changes.outputs.mode == 'graph'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.sdk_artifact.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      # Requires a passing receipt for every test area under this checkout's
      # revision (scripts/lib/ci.mjs, approvedTests).
      - name: Approve the checked revision
        id: approve
        if: steps.changes.outputs.mode == 'graph'
        run: node scripts/ci/ci.mjs approve
      # Pure comparison of the approved SHA with the workflow's, after every
      # check passed. It ran as a job of its own until #51; as a step it saves
      # a runner start, a checkout and a toolchain setup on every run.
      - name: Require successful checks for the same commit
        id: gate
        if: steps.changes.outputs.mode == 'graph'
        env:
          CI_TESTED_SHA: ${{ steps.approve.outputs.tested_sha }}
        run: node scripts/ci/ci.mjs gate
      # What a push on main replays. Only a successful run's upload is ever
      # used; a rerun of this run replaces the earlier attempt's.
      - name: Upload the task cache for main
        if: steps.changes.outputs.cache == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vite-task-cache
          path: node_modules/.vite/task-cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      # Saved after a failure too, so a rerun replays the tasks that passed:
      # Vite Task never caches a failed task. A fork's pull request has a
      # read-only cache token, and the save only warns.
      - name: Save the task cache
        if: ${{ !cancelled() && steps.task_cache.outcome == 'success' && (steps.graph.outcome == 'success' || steps.graph.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task_cache.outputs.cache-primary-key }}
      - name: Summarize suites and pending coverage
        if: always()
        env:
          CI_CHANGES_MODE: ${{ steps.changes.outputs.mode }}
        run: node scripts/ci/ci.mjs summary
      - name: Upload sanitized validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-results/revision.json
            .ci-results/tests.json
            .ci-results/tests/*.json
            .ci-results/nfe/independent.json
            .ci-results/nfse/independent.json
            .ci-results/74/package.json
            .ci-results/74/sdk-metafile.json
            .ci-results/83/tarballs.json
            .ci-results/summary.md
            .browser-results/auth-worker/report.json
            .browser-results/privacy-worker/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
