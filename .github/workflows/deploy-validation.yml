name: Deploy validation

# Manual only: publishes the top of main. Production publishes main on push
# through deploy.yml; a push never writes to validation.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Persistent validation only
        required: true
        type: choice
        options: [validation]

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.target == 'validation'
    uses: ./.github/workflows/ci.yml
    # What ci.yml's Validate job declares; a called workflow cannot ask for
    # more than its caller grants. Read only, and here unused: under
    # workflow_call the graph runs without the task cache.
    permissions:
      contents: read
      actions: read
      pull-requests: read

  deploy:
    name: Publish validation
    needs: validate
    if: needs.validate.outputs.tested_sha == github.sha && github.ref == 'refs/heads/main' && inputs.target == 'validation'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment:
      name: validation
      url: https://freecorpsnfe-validation.freecorps.workers.dev
    # One writer from the eligibility check until smoke/recovery evidence.
    # Pending runs may be superseded; a running two-service publication finishes.
    concurrency:
      group: validation-publication
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tested_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "24.22.1"
          run-install: false
          cache: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      # Browser only: the Blacksmith image already has every library Chromium
      # links against (#51). --with-deps went through apt and added CJK and
      # Thai fonts, Xvfb and library upgrades the headless M0 journeys do not
      # use, 4 of the 11 minutes of the run on a slow mirror. A missing library
      # fails the launch in the journeys, not silently.
      - name: Install Chromium for the published M0 journeys
        run: node apps/console/node_modules/playwright/cli.js install chromium
      - name: Publish the approved revision and verify both services
        env:
          CI_TESTED_SHA: ${{ needs.validate.outputs.tested_sha }}
          GH_TOKEN: ${{ github.token }}
          VALIDATION_CONVEX_DEPLOY_KEY: ${{ secrets.VALIDATION_CONVEX_DEPLOY_KEY }}
          VALIDATION_CLOUDFLARE_API_TOKEN: ${{ secrets.VALIDATION_CLOUDFLARE_API_TOKEN }}
          VALIDATION_SMOKE_EMAIL: ${{ secrets.VALIDATION_SMOKE_EMAIL }}
          VALIDATION_SMOKE_PASSWORD: ${{ secrets.VALIDATION_SMOKE_PASSWORD }}
        run: node scripts/validation/deploy-validation.mjs
      - name: Validate published journeys in the browser
        env:
          CI_TESTED_SHA: ${{ needs.validate.outputs.tested_sha }}
          VALIDATION_E2E_SHA: ${{ needs.validate.outputs.tested_sha }}
          VALIDATION_SMOKE_EMAIL: ${{ secrets.VALIDATION_SMOKE_EMAIL }}
          VALIDATION_SMOKE_PASSWORD: ${{ secrets.VALIDATION_SMOKE_PASSWORD }}
        run: node apps/console/e2e/m0.mjs
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .browser-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Record publication or partial failure
        if: always()
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        run: node scripts/validation/deploy-validation.mjs summary
      - name: Upload sanitized publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .validation-results/deployment.json
            .validation-results/summary.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
